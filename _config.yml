title: My Awakening Journey
description: >-
  Observations from an evolving spiritual journey — on spirituality,
  human nature, and what technology is doing to human development.
author: François Charette
url: "https://francoischarette.github.io"
baseurl: "/myAwakeningJourney"

# Links shown in the site header/footer
youtube_channel: "https://www.youtube.com/@FrancoisVenturesIntoAwakening"
professional_site: "https://francoischarette.github.io/bio/"

# --- Giscus comments (powered by GitHub Discussions) ---
# IDs below were read from the GitHub API; comments render once the giscus
# app is installed on this repo (https://github.com/apps/giscus).
giscus:
  repo: "FrancoisCharette/myAwakeningJourney"
  repo_id: "R_kgDOTmETzw"
  category: "Announcements"
  category_id: "DIC_kwDOTmETz84DCKFm"

markdown: kramdown
permalink: /posts/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Values applied to every post automatically
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - README.md
  - LICENSE
