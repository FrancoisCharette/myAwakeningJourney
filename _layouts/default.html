<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/topics/' | relative_url }}">Topics</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
  </header>

  <main class="content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>
      © {{ 'now' | date: "%Y" }} {{ site.author }} ·
      <a href="{{ site.youtube_channel }}">YouTube</a> ·
      <a href="{{ site.professional_site }}">Professional site</a> ·
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </p>
    <p class="footer-note">A living journal — posts here evolve as I do.</p>
  </footer>
</body>
</html>
